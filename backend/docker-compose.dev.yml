services:
  postgres:
    image: postgres:15-alpine
    container_name: streamflow-db
    ports:
      - "9999:5432"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: streaming_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  media-server:
    container_name: streamflow-media
    build: ../media_server
    command: nginx -c /etc/nginx/nginx.dev.conf -g 'daemon off;'
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - hls_data:/tmp/hls

  frontend:
    container_name: streamflow-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000

  storage:
    image: minio/minio
    container_name: streamflow-storage
    command: server /data --console-address ":9090"
    restart: always
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=test
      - MINIO_ROOT_PASSWORD=secure123$

volumes:
  postgres_data:
  hls_data:
  minio_data: