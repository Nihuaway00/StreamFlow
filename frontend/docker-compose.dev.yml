version: '3.8'

services:
  postgres:
    container_name: postgres
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: streaming_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    container_name: backend
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/streaming_db
      - MINIO_ENDPOINT=storage:9000
      - MINIO_ACCESSKEY=test
      - MINIO_SECRETKEY=secure123
      - MINIO_BUCKET=dev
    depends_on:
      - postgres

  media-server:
    container_name: media_server
    build: ../media_server
    command: nginx -c /etc/nginx/nginx.dev.conf -g 'daemon off;'
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - hls_data:/tmp/hls
    depends_on:
      - backend

  storage:
    image: minio/minio
    command: server /data --console-address ":9090"
    restart: always
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=test
      - MINIO_ROOT_PASSWORD=secure123$

volumes:
  postgres_data:
  hls_data: