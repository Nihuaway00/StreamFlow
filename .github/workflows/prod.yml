name: Deploy to Server

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: prod
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: SSH deploy
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        script: |
          cd ~/StreamFlow/
          git pull origin prod

          # Создаем файл .env с секретами
          echo "API_HOST=${{ secrets.SERVER_HOST }}" > .env.prod
          echo "API_PORT=80" >> .env.prod
          echo "HLS_BASE_URL=http://${{ secrets.SERVER_HOST }}:8080" >> .env.prod
          

          chmod +x deploy.sh
          ./deploy.sh
