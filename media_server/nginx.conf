worker_processes auto;
rtmp_auto_push on;

events {
    worker_connections 1024;
}

# RTMP сервер
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Приложение для live стримов
        application live {
            live on;
            record off;

            # HLS настройки
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3s;
            hls_playlist_length 20s;
            hls_nested on;  # ВАЖНО: создает папку для каждого stream_key

            # Webhooks в Backend
            on_publish http://backend:8000/api/webhooks/stream/publish;
            on_publish_done http://backend:8000/api/webhooks/stream/unpublish;
        }
    }
}

# HTTP сервер для раздачи HLS
http {
    server {
        listen 8080;

        location /live {
            # Алиас на директорию с HLS файлами
            alias /tmp/hls;

            # MIME типы для HLS
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            # CORS заголовки
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Range' always;
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;

            # Отключить кеширование
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
            add_header Pragma 'no-cache' always;
            add_header Expires '0' always;

            # Включить autoindex для отладки (можно отключить в production)
            autoindex on;
        }

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/local/nginx/html;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}