worker_processes auto;
rtmp_auto_push on;

events {
    worker_connections 1024;
}

# RTMP сервер
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Приложение для live стримов
        application live {
            live on;
            record off;

            # HLS настройки
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3s;
            hls_nested on;
            hls_playlist_length 20s;
            hls_nested on;

            # Webhooks в Backend
            on_publish http://backend:8000/api/webhooks/stream/publish;
            on_publish_done http://backend:8000/api/webhooks/stream/unpublish;
        }
    }
}

# HTTP сервер для раздачи HLS
http {
    server {
        listen 8080;

        # Раздача HLS стримов
        location /live/ {
            alias /tmp/hls/;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            # CORS
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Range' always;

            # Кеширование
            add_header Cache-Control 'no-cache' always;

            # Autoindex для отладки
            autoindex on;
        }

        # Плеер для просмотра
        location /player {
            alias /usr/share/nginx/html/player.html;
            default_type text/html;
        }

        location /static/ {
            alias /usr/share/nginx/html/static/;
        }

        # RTMP статистика
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Главная страница - редирект на плеер
        location = / {
            return 301 /player;
        }
    }
}